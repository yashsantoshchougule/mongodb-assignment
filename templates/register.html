{% extends "base.html" %}
{% block title %}Register · ValueVista Mini{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-icon">🚀</span>
      <h1>Create an account</h1>
      <p>Join ValueVista Mini and start comparing</p>
    </div>
    <form class="auth-form" method="post" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required minlength="3" maxlength="20" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required minlength="6" autocomplete="new-password">
      </div>
      <button class="button button-primary auth-submit" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</section>
{% endblock %}
